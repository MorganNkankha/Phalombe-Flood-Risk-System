<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flood Risk Map · Phalombe Flood Risk &amp; Evacuation Support</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="map">
  <main class="main" id="main">
    <div class="map-page">

      <div class="toolbar">
        <div class="search-wrap">
          <input id="searchInput" class="input" type="search" placeholder="Search a village, school, health facility or TA" autocomplete="off"
                 role="combobox" aria-expanded="false" aria-controls="suggestions" aria-label="Search the map">
          <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
        </div>
        <select id="riskFilter" class="select" aria-label="Filter by risk class">
          <option value="All">Risk: All</option>
          <option value="High">Risk: High</option>
          <option value="Medium">Risk: Medium</option>
          <option value="Low">Risk: Low</option>
          <option value="None">Outside mapped zones</option>
        </select>
        <select id="taFilter" class="select" aria-label="Filter by Traditional Authority">
          <option value="All">TA: All</option>
        </select>
        <span class="spacer"></span>
        <span class="card-note" id="visibleCount"></span>
        <button class="btn btn-ghost" id="exportBtn" title="Download the visible settlements as a CSV file">Export CSV</button>
        <button class="btn btn-ghost" id="resetBtn">Reset view</button>
      </div>

      <div class="map-box" id="mapBox">
        <div id="floodMap" aria-label="Interactive flood-risk map of Phalombe District"></div>

        <div class="map-tools">
          <button id="fullscreenBtn" title="Full screen" aria-label="Full screen">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          </button>
        </div>

        <div class="map-panel layers-panel" id="layersPanel">
          <h4>Layers</h4>
          <label><input type="checkbox" data-layer="zones" checked> Flood-risk zones</label>
          <label><input type="checkbox" data-layer="rivers" checked> Rivers and streams</label>
          <label><input type="checkbox" data-layer="settlements" checked> Settlements <span class="dot" style="background:#0f172a"></span></label>
          <label><input type="checkbox" data-layer="centres"> Potential centres <span class="dot" style="background:#1d5fd1"></span></label>
          <label><input type="checkbox" data-layer="health"> Health facilities <span class="dot" style="background:#be185d"></span></label>
          <label><input type="checkbox" data-layer="roads" checked> Roads</label>
          <label><input type="checkbox" data-layer="tas" checked> Admin boundaries</label>
          <hr>
          <h4>Background</h4>
          <div class="seg" id="basemapSeg">
            <button data-basemap="Light" class="on">Light</button>
            <button data-basemap="Streets">Streets</button>
            <button data-basemap="Satellite">Satellite</button>
            <button data-basemap="Terrain">Terrain</button>
          </div>
        </div>

        <div class="map-panel legend-panel">
          <h4>Legend</h4>
          <div class="legend-item"><span class="swatch" style="background:var(--high)"></span>High risk</div>
          <div class="legend-item"><span class="swatch" style="background:var(--medium)"></span>Medium risk</div>
          <div class="legend-item"><span class="swatch" style="background:var(--low)"></span>Low risk</div>
          <div class="legend-item"><span class="swatch line" style="background:#3d85c6"></span>River</div>
          <div class="legend-item"><span class="swatch line" style="background:#b38600"></span>Main road</div>
        </div>

        <div class="coords" id="coords">Move over the map to see coordinates</div>
      </div>

      <aside class="card details" id="detailsPanel" aria-live="polite"></aside>
    </div>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/turf.min.js"></script>
  <script src="js/config.js"></script>
  <script src="data/phalombe-data.js"></script>
  <script src="js/data.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/map-common.js"></script>
  <script src="js/flood-map.js"></script>
</body>
</html>
